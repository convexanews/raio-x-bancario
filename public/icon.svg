<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo azul arredondado -->
  <rect width="180" height="180" rx="40" fill="#2563EB"/>

  <!-- Sinal de radar (ondas semicirculares) -->
  <!-- Onda externa -->
  <path d="M90 130 C62 130 40 108 40 80 C40 52 62 30 90 30" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- Onda média -->
  <path d="M90 118 C70 118 54 102 54 82 C54 62 70 46 90 46" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Onda interna -->
  <path d="M90 106 C77 106 67 96 67 83 C67 70 77 60 90 60" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Linha vertical central -->
  <line x1="90" y1="30" x2="90" y2="148" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- Ponto central -->
  <circle cx="90" cy="84" r="10" fill="white"/>
</svg>
